<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1026"/>
      <stop offset="0.55" stop-color="#161B44"/>
      <stop offset="1" stop-color="#241A52"/>
    </linearGradient>
    <linearGradient id="zg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DF3FF"/>
      <stop offset="0.5" stop-color="#4AC8F0"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 底板 -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect width="256" height="256" rx="56" fill="url(#glow)"/>

  <!-- 虚线轨道（轮换） -->
  <circle cx="128" cy="128" r="92" fill="none" stroke="#FFFFFF" stroke-opacity="0.10"
          stroke-width="5" stroke-dasharray="9 13" stroke-linecap="round"/>

  <!-- 高亮旋转弧 -->
  <path d="M 216.9 104.2 A 92 92 0 0 0 112 37.4" fill="none"
        stroke="url(#arc)" stroke-width="7" stroke-linecap="round"/>

  <!-- 出口节点：两活一冷却（空心） -->
  <circle cx="200.5" cy="71.4" r="7" fill="#67E8F9"/>
  <circle cx="41.6" cy="159.5" r="7" fill="#A78BFA"/>
  <circle cx="144" cy="218.6" r="7" fill="none" stroke="#8FA0C8" stroke-width="4" stroke-opacity="0.85"/>

  <!-- Z 字主线 -->
  <path d="M 86 88 H 170 L 86 168 H 170" fill="none" stroke="url(#zg)"
        stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
